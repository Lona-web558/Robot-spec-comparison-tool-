<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Spec Comparison Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>Robot Spec Comparison Tool</h1>
      <p class="tagline">Pick up to 4 robots to compare height, weight, speed, payload, battery life and more.</p>
      <div class="row g-2 mt-3 align-items-center">
        <div class="col-12 col-md">
          <input id="search" type="search" class="form-control" placeholder="Search by name or manufacturer" aria-label="Search robots">
        </div>
        <div class="col-6 col-md-auto">
          <select id="category" class="form-select" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="col-6 col-md-auto">
          <select id="manufacturer" class="form-select" aria-label="Filter by manufacturer">
            <option value="">All manufacturers</option>
          </select>
        </div>
      </div>
      <p class="disclaimer mt-3 mb-0">Specs are drawn from public manufacturer information and may be approximate or outdated. Confirm against the manufacturer's site before relying on them.</p>
    </div>
  </header>

  <main class="container py-4">
    <div id="status" class="status" role="status"></div>
    <div id="grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3 mb-4"></div>

    <section id="compareSection" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 mb-0">Comparison (<span id="compareCount">0</span> selected)</h2>
        <button id="clearCompare" class="btn btn-sm btn-outline-warning">Clear selection</button>
      </div>
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle compare-table">
          <thead><tr id="compareHead"></tr></thead>
          <tbody id="compareBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
